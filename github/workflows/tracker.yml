name: Update tracker

on:
  schedule:
    - cron: "0 */6 * * *"       # every 6 hours
    - cron: "30 15,16 * * 0"    # extra Sunday runs before the 1pm ET games
  workflow_dispatch:            # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull data and flag games
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TASK_ID: ${{ secrets.APIFY_TASK_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/tracker.py
      - name: Save data
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Update data" && git push)
